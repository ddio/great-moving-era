title: 考古學者的搬家說明（範例）
subtitle: 書很多、拓本很脆弱，其餘都好說。
updated: 2026-09-23
contact:
  name: R 小姐
  phone: 0900-000-000（範例）
  note: 看書時不接電話，請傳訊息，我會回覆的。

logistics:
  from:
    label: 舊址
    address: 水之七區 造船廠街（範例地址，寫到路段就好）
    floor: 3F（共 4 層）
    elevator: 沒有，全程走樓梯
    parking: 貨車可停巷口，距大門約 15 公尺
    stairs: 樓梯寬 90 cm，每層一個轉角
    access: 管理員很好說話，但請避開他的午睡時間 13:00–14:00
  to:
    label: 新址
    address: 新世界 某座島 港口路（範例地址）
    floor: 7F（共 12 層）
    elevator: 有，轎廂 110 × 150 × 230 cm，門寬 90 cm
    parking: 地下室卸貨區，可停 3.5 噸貨車
    access: 需前三天向管委會登記，並鋪設電梯保護板
  preferredDate: 2026-11-14（六），上午開始
  notes:
    - 舊址沒有電梯、書又很多，這應該是報價重點
    - 希望一天內完成

overview:
  notes:
    - 舊址 1 房 1 廳加 1 間書房，約 20 坪，一人居住
    - 行李大部分是書:
        - 書籍約 60 箱，每箱都偏重，建議用小箱裝
        - 其他雜物約 15 箱
    - 家具大多不帶走，只搬下方清單裡的 6 件
    - 照片由名畫代打，請多包涵
  images:
    - 舊址平面圖（示意）

furniture:
  - [實木書櫃, 180×40×220cm, 層板可拆，約 60kg。倒下來壓到人的話，可就不好玩了呢]
  - [古地球儀, 直徑 45cm, 易碎，請單獨包裝]
  - [拓本木箱, 90×60×30cm, 內容物極易碎，請平放、不可疊壓]
  - [單人床架, 190×100×90cm, 可拆]
  - [獨立筒床墊, 188×97×25cm, 不可折]
  - [閱讀躺椅, 170×70×80cm, 不可拆]

rooms:
  - id: entrance
    name: 玄關
    summary: 門都很有年紀了，搬運時請小心門框。
    notes:
      - 單扇門寬 80 cm，兩扇全開可到 150 cm
    layout:
      - 從玄關看向走廊，兩側的門都能全開

  - id: livingroom
    name: 客廳
    summary: 我大部分的時間都在這裡看書。
    notes:
      - 家具都不帶走，只有窗邊的書要打包（約 12 箱）
      - 地板是老木地板，請穿鞋套
    layout:
      - 客廳全景，窗邊是我常站著看書的位置
      - 下午的光線。地板已經清空，搬運動線很寬

  - id: study
    name: 書房
    summary: 全屋最重的房間。
    notes:
      - 書籍約 40 箱:
          - 大多是歷史與考古文獻，每箱都偏重
          - 幾本古書請另外包，不要和一般書混裝
      - 地球儀與拓本木箱都在這裡，請見大型家具清單
    layout:
      - 書房全景，右後方櫃子上是地球儀
    detail:
      - 地球儀，直徑約 45 cm
      - 桌上的地圖與文獻，請整疊平放裝箱

  - id: kitchen
    name: 廚房
    summary: 廚具不多，冰箱和爐灶都不帶走。
    notes:
      - 餐具約 3 箱，陶罐類請包氣泡紙
    layout:
      - 廚房全景
    detail:
      - 陶罐與麵包籃，易碎
      - 爐灶是房東的，請不要搬走

  - id: bedroom
    name: 臥室
    summary: 只有床要帶走。
    notes:
      - 床架可拆，床墊不可折
      - 衣物約 6 箱
    layout:
      - 臥室全景
    detail:
      - 兩張椅子都不帶走

  - id: reading
    name: 閱讀角
    summary: 躺椅要帶走，狗不用。
    notes:
      - 躺椅不可拆，寬 170 cm
      - 牆上的畫與掛飾約 2 箱，請包好
    layout:
      - 閱讀角全景
    detail:
      - 這位不是我的狗，不在搬運範圍內
