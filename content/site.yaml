# ============================================================
#  搬家估價說明 — 唯一要編輯的檔案
#  改完後執行：  ./build.sh
# ============================================================
#
#  圖片怎麼寫？
#    圖片檔名規則為  <房間id>-<類型>-<兩位數編號>.jpg
#    放在 images/full/ 底下。YAML 裡「只要寫圖說」，
#    檔名由 build 依照房間 id、類型、順序自動組出來。
#
#      layout:
#        - 從玄關看向客廳        → livingroom-layout-01.jpg
#        - 靠窗側的沙發與邊桌    → livingroom-layout-02.jpg
#
#    若中間有編號被刪掉、或想直接指定編號，寫成「編號: 圖說」：
#      layout:
#        - 5: 這張是 livingroom-layout-05.jpg
#        - 之後接續編號 06
#
#    build 時會檢查每個檔案是否存在，缺檔會報錯；
#    資料夾裡有、但 YAML 沒提到的圖，會列成警告提醒你補圖說。
#
#  物品清單怎麼寫？
#    items 每行為  [名稱, 數量, 尺寸, 備註]
#    尺寸寫成「長×寬×高cm」就會自動換算材積並加總；
#    也認得「標準箱」(60×40×40) 與「標準吊衣箱」(50×50×100)。
#    名稱含「箱」字者會被歸類為紙箱、與家具家電分開統計。
#
#  文字怎麼寫？
#    notes 底下一行一個項目，就是一個 bullet。
#    想要子項目，寫成「標題:」再縮排列出來（最多兩層）。
# ============================================================

title: 忠孝東路 → 板橋文化路 搬家說明
subtitle: 提供給搬家公司線上估價使用
updated: 2026-09-22
contact:
  name: 陳先生
  phone: 0912-345-678
  note: 平日 19:00 後、假日全天方便通話

# ---------- 搬運條件（估人力與車次最關鍵的一頁） ----------
logistics:
  from:
    label: 舊址
    address: 台北市大安區忠孝東路四段 O 巷 O 號
    floor: 5F（共 12 層）
    elevator: 有，轎廂內部 100 × 140 × 220 cm，門寬 80 cm
    parking: 可臨停大門口，人行道到大門約 8 公尺、無階梯
    stairs: 樓梯寬 95 cm，每層一個 180 度轉角
    access: 大樓管理室需前一日登記，搬運時段限 09:00–17:00
  to:
    label: 新址
    address: 新北市板橋區文化路一段 O 號
    floor: 4F（共 5 層）
    elevator: 無，需走樓梯
    parking: 巷內可停 3.5 噸，距大門約 25 公尺
    stairs: 樓梯寬 82 cm，2F→3F 間有一處 90 度窄轉角（淨寬約 78 cm）
    access: 無管理室，鄰居已知會
  preferredDate: 2026-11-08（六）或 11-09（日），上午開始
  notes:
    - 舊址電梯可用，新址需全程走樓梯，這是報價重點
    - 新址樓梯轉角僅 78 cm，三人沙發與雙門冰箱可能需吊掛或拆解
    - 希望一天內完成；若需兩趟車，可接受分兩天
    - 貓兩隻與水族箱當天由屋主自行載運，不列入搬運範圍

# ---------- 整體說明 ----------
overview:
  notes:
    - 舊址為 2 房 2 廳 1 衛，權狀 28 坪、實際使用約 22 坪
    - 居住人數 2 大人，無小孩、無長輩同住
    - 需要搬運的大型家具共 11 件:
        - 沙發、餐桌椅、床架與床墊、衣櫃、書櫃 ×3、書桌 ×2
        - 其中四門衣櫃與書櫃可拆板，沙發與床墊不可拆
    - 家電共 6 件:
        - 雙門冰箱、滾筒洗衣機、55 吋電視、氣炸鍋、除濕機 ×2
    - 紙箱預估 45–55 箱（書籍約 18 箱，偏重）
    - 需要搬家公司代打包的範圍:
        - 廚房碗盤與玻璃杯具
        - 書房整面書櫃
        - 其餘由屋主自行打包完成
  images:
    - 舊址平面圖，房間編號對應下方各區段
    - 新址平面圖，標示家具預定擺放位置

# ---------- 各房間 ----------
rooms:
  - id: entrance
    name: 玄關
    summary: 物品少，主要是鞋櫃與雨具，預計 15 分鐘完成
    notes:
      - 鞋櫃為系統櫃、固定於牆面，不搬運
      - 穿鞋椅與傘桶要帶走
    items:
      - [穿鞋椅, 1, 60×35×45cm, 實木、不可拆]
      - [傘桶, 1, 25×25×50cm, ""]
      - [紙箱（鞋）, 3, 標準箱, 屋主自行打包]
    layout:
      - 由大門看向玄關與鞋櫃
      - 由客廳回看玄關，走道淨寬 95 cm
    detail:
      - 鞋櫃最下層：雨具與清潔用品，此櫃不搬

  - id: livingroom
    name: 客廳
    summary: 大件最多的區域，沙發為搬運難點
    notes:
      - 三人座布沙發不可拆解，寬 210 cm:
          - 舊址電梯轎廂深 140 cm，需直立放入
          - 新址樓梯轉角淨寬 78 cm，請評估是否需吊掛
      - 電視櫃為壁掛式、鎖在牆上，需拆卸後帶走
      - 55 吋電視原廠紙箱已丟棄，需要搬家公司提供電視專用箱
      - 地毯與抱枕由屋主自行捲收打包
    items:
      - [三人座布沙發, 1, 210×90×85cm, 不可拆、搬運難點]
      - [單人沙發椅, 1, 80×80×85cm, ""]
      - [茶几, 1, 110×60×40cm, 玻璃桌面需另包]
      - [壁掛電視櫃, 1, 150×40×35cm, 需拆卸]
      - [55 吋電視, 1, 125×75×8cm, 需電視專用箱]
      - [立燈, 2, 40×40×170cm, 可拆成兩段]
      - [紙箱（雜物）, 8, 標準箱, ""]
    layout:
      - 從玄關看向客廳全景
      - 沙發與茶几，背景為陽台落地窗
      - 電視牆與壁掛電視櫃
    detail:
      - 電視櫃抽屜：遙控器、線材、轉接頭
      - 電視櫃下層：遊戲主機與音響擴大機
      - 茶几下層：雜誌與桌遊，約可裝 2 箱

  - id: kitchen
    name: 廚房 / 餐廳
    summary: 碗盤玻璃器皿多，需要搬家公司代打包
    notes:
      - 流理台、抽油煙機、瓦斯爐為房東財產，不搬運
      - 冰箱為雙門 480L，高 180 cm、需兩人搬運:
          - 搬運前一日會先除霜、清空
      - 餐桌為實木、桌腳可拆
      - 碗盤與玻璃杯具請搬家公司代打包（約 6–8 箱）
    items:
      - [雙門冰箱, 1, 70×70×180cm, 480L、需兩人]
      - [實木餐桌, 1, 140×80×75cm, 桌腳可拆]
      - [餐椅, 4, 45×50×90cm, 可疊放]
      - [電鍋／氣炸鍋等小家電, 5, 各約 40×35×35cm, 屋主自行打包]
      - [紙箱（碗盤玻璃）, 8, 標準箱, 需代打包、易碎]
      - [紙箱（乾貨調味料）, 3, 標準箱, ""]
    layout:
      - 廚房全景，右側為冰箱位置
      - 餐廳區，餐桌與四張餐椅
    detail:
      - 上櫃：碗盤與保鮮盒，約 3 箱
      - 下櫃：鍋具與烤盤，偏重，約 2 箱
      - 餐邊櫃抽屜：餐具與刀叉
      - 玻璃杯具，共約 20 只，需個別包覆

  - id: master
    name: 主臥
    summary: 衣櫃與床墊為主，衣物量大
    notes:
      - 雙人床架為排骨床、可完全拆解
      - 獨立筒床墊 5 尺，不可折、重約 35 kg
      - 四門衣櫃為組合式，可拆板運送:
          - 衣物約 3 個吊衣箱
          - 棉被與換季衣物已裝箱
    items:
      - [雙人床架, 1, 152×188×35cm, 可拆解]
      - [獨立筒床墊, 1, 152×188×25cm, 不可折、約 35kg]
      - [四門衣櫃, 1, 200×60×220cm, 可拆板]
      - [床頭櫃, 2, 45×40×50cm, ""]
      - [梳妝台, 1, 100×45×75cm, 含鏡子、需另包]
      - [吊衣箱, 3, 標準吊衣箱, 搬家公司提供]
      - [紙箱（衣物寢具）, 10, 標準箱, ""]
    layout:
      - 主臥全景，左側為四門衣櫃
      - 床鋪與兩側床頭櫃
      - 梳妝台與穿衣鏡
    detail:
      - 衣櫃吊掛區：外套與襯衫，約 3 個吊衣箱
      - 衣櫃層板區：摺疊衣物，已裝箱
      - 床頭櫃抽屜：書籍、充電線、常用藥品

  - id: study
    name: 書房
    summary: 書籍量大、紙箱偏重，請預留人力
    notes:
      - 書櫃 3 座，皆為組合式、可拆板
      - 書籍約 18 箱，每箱請勿裝滿，避免破底
      - 兩張書桌，其中一張為升降桌、底座重約 25 kg
      - 電腦主機與兩台螢幕需防震包裝
    items:
      - [書櫃, 3, 80×30×180cm, 可拆板]
      - [升降書桌, 1, 140×70×75cm, 桌腳含馬達、約 25kg]
      - [書桌, 1, 120×60×75cm, ""]
      - [辦公椅, 2, 65×65×120cm, 可拆椅背]
      - [電腦主機, 1, 45×20×45cm, 需防震]
      - [27 吋螢幕, 2, 62×20×45cm, 需防震]
      - [紙箱（書籍）, 18, 標準箱, 偏重、勿裝滿]
    layout:
      - 書房全景，三面書櫃
      - 工作區，升降桌與雙螢幕
    detail:
      - 書櫃上層：精裝書與工具書，最重的部分
      - 抽屜櫃：文件、電線與備品

  - id: balcony
    name: 陽台
    summary: 洗衣機與盆栽，盆栽屋主自行處理
    notes:
      - 滾筒洗衣機需先鎖上運輸螺栓，屋主已備妥
      - 曬衣架為固定式，不搬運
      - 盆栽 8 盆由屋主自行載運，不列入報價
    items:
      - [滾筒洗衣機, 1, 60×60×85cm, 需鎖運輸螺栓]
      - [層架, 1, 60×30×120cm, 可拆]
      - [清潔用品收納箱, 2, 50×35×30cm, ""]
    layout:
      - 陽台全景，左側洗衣機
      - 從陽台看向客廳
    detail:
      - 層架上的清潔用品與工具箱

  - id: bathroom
    name: 浴室
    summary: 幾乎沒有搬運物，1 箱即可
    notes:
      - 所有設備皆為房東財產，不搬運
      - 僅帶走個人盥洗用品與備品
    items:
      - [紙箱（盥洗備品）, 1, 標準箱, ""]
    layout:
      - 浴室全景
    detail:
      - 洗手台下方收納：備品與清潔劑
