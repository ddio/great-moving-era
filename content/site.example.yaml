# ============================================================
#  搬家估價說明 — 資料範本
#
#  使用方式：
#      cp content/site.example.yaml content/site.yaml
#  然後編輯 content/site.yaml（真實資料，不進版控）。
#
#  改完後執行：  ./build.sh      或開著 python3 tools/dev.py 自動重建
# ============================================================
#
#  圖片怎麼寫？
#    原始照片放 images/src/，檔名規則為
#        <房間id>-<類型>-<兩位數編號>.jpg
#    類型為 layout（大格局）或 detail（細節）；
#    整體平面圖用 overview-plan-01.jpg。
#    tools/images.py 會產出網頁用的大圖與縮圖並清除 EXIF/GPS。
#
#    YAML 裡「只要寫圖說」，檔名由 build 依房間 id、類型、順序自動組出來：
#
#      layout:
#        - 從玄關看向客廳        → livingroom-layout-01.jpg
#        - 靠窗側的沙發與邊桌    → livingroom-layout-02.jpg
#
#    若中間有編號被刪掉、或想直接指定編號，寫成「編號: 圖說」：
#      layout:
#        - 5: 這張是 livingroom-layout-05.jpg
#        - 之後接續編號 06
#
#    build 時會檢查每個檔案是否存在，缺檔會報錯；
#    資料夾裡有、但 YAML 沒提到的圖，會列成警告提醒你補圖說。
#    圖說中若要用半形冒號，請用引號包起來："抽屜: 線材"
#
#  物品清單怎麼寫？
#    items 每行為  [名稱, 數量, 尺寸, 備註]
#    尺寸寫成「長×寬×高cm」就會自動換算材積並加總；
#    也認得「標準箱」(60×40×40) 與「標準吊衣箱」(50×50×100)。
#    名稱含「箱」字者會被歸類為紙箱、與家具家電分開統計。
#
#  文字怎麼寫？
#    notes 底下一行一個項目，就是一個 bullet。
#    想要子項目，寫成「標題:」再縮排列出來（最多兩層）。
#
#  用不到的欄位可以整段刪掉，或留空不填。
# ============================================================

title: OO 路 → XX 路 搬家說明
subtitle: 提供給搬家公司線上估價使用
updated: 2026-09-22
contact:
  name:            # 例：陳先生
  phone:           # 例：0912-345-678
  note:            # 例：平日 19:00 後方便通話

# ---------- 搬運條件（估人力與車次最關鍵的一頁） ----------
logistics:
  from:
    label: 舊址
    address:
    floor:         # 例：5F（共 12 層）
    elevator:      # 例：有，轎廂內部 100 × 140 × 220 cm，門寬 80 cm
    parking:       # 例：可臨停大門口，人行道到大門約 8 公尺、無階梯
    stairs:        # 例：樓梯寬 95 cm，每層一個 180 度轉角
    access:        # 例：管理室需前一日登記，搬運時段限 09:00–17:00
  to:
    label: 新址
    address:
    floor:
    elevator:
    parking:
    stairs:
    access:
  preferredDate:   # 例：2026-11-08（六）或 11-09（日），上午開始
  notes:
    # - 新址需全程走樓梯，這是報價重點
    # - 希望一天內完成；若需兩趟車，可接受分兩天

# ---------- 整體說明 ----------
overview:
  notes:
    # - 舊址為 2 房 2 廳 1 衛，實際使用約 22 坪
    # - 需要搬運的大型家具共 11 件:
    #     - 沙發、餐桌椅、床架與床墊、衣櫃
    #     - 其中衣櫃可拆板，沙發與床墊不可拆
    # - 紙箱預估 45–55 箱（書籍約 18 箱，偏重）
  images:
    # - 舊址平面圖        → images/src/overview-plan-01.jpg
    # - 新址平面圖        → images/src/overview-plan-02.jpg

# ---------- 各房間 ----------
# id 只能用小寫英數與 - _（會用在檔名上），name 是頁面顯示的名稱。
# 照這個格式往下複製即可，常見的有：
#   entrance 玄關 / livingroom 客廳 / kitchen 廚房 / master 主臥
#   bedroom2 次臥 / study 書房 / bathroom 浴室 / balcony 陽台
rooms:
  - id: livingroom
    name: 客廳
    summary:       # 一句話重點，會顯示在房間標題下方與彙總表
    notes:
      # - 三人座布沙發不可拆解，寬 210 cm:
      #     - 新址樓梯轉角淨寬 78 cm，請評估是否需吊掛
      # - 電視櫃為壁掛式、鎖在牆上，需拆卸後帶走
    items:
      # - [三人座布沙發, 1, 210×90×85cm, 不可拆、搬運難點]
      # - [茶几, 1, 110×60×40cm, 玻璃桌面需另包]
      # - [紙箱（雜物）, 8, 標準箱, ""]
    layout:
      # - 從玄關看向客廳全景    → livingroom-layout-01.jpg
      # - 電視牆與壁掛電視櫃    → livingroom-layout-02.jpg
    detail:
      # - 電視櫃抽屜：遙控器、線材    → livingroom-detail-01.jpg
